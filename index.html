<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Приглашение</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <section class="block-img">
        <img src="foto1.png" alt="Фото 1">
    </section>

    <section class="block-img">
        <img src="foto2.png" alt="Фото 2">
    </section>

    <section class="block-img">
        <a href="https://yandex.ru/maps/org/sherri/1059834533/?ll=39.731542%2C54.632711&z=16" target="_blank" rel="noopener noreferrer">
            <img src="foto3.png" alt="Адрес на карте">
        </a>
    </section>

    <section class="block-img">
        <img src="foto4.png" alt="Фото 4">
    </section>

    <section class="block-img">
        <img src="foto5.png" alt="Фото 5">
    </section>

    <section class="block-img">
        <img src="foto6.png" alt="Фото 6">
    </section>

    <section class="block-img">
        <img src="foto7.png" alt="Фото 7">
    </section>

    <section class="block-form">
        <form id="weddingForm">
            
            <div class="form-group">
                <label for="guestName">Напишите имя и фамилию</label>
                <input type="text" id="guestName" required placeholder="Ваше имя">
            </div>

            <div class="form-group">
                <label>Сможете ли присутствовать на свадьбе?</label>
                <div class="radio-group">
                    <label><input type="radio" name="attendance" value="С удовольствием приду" required> С удовольствием приду</label>
                    <label><input type="radio" name="attendance" value="К сожалению, не смогу"> К сожалению, не смогу</label>
                    <label><input type="radio" name="attendance" value="Сообщу позже"> Сообщу позже</label>
                </div>
            </div>

            <div class="form-group">
                <label>Есть ли у Вас особые предпочтения по еде?</label>
                <div class="radio-group">
                    <label><input type="radio" name="food" value="Нет" required> Нет</label>
                    <label><input type="radio" name="food" value="Ем мясо"> Ем мясо</label>
                    <label><input type="radio" name="food" value="Ем рыбу"> Ем рыбу</label>
                    <label><input type="radio" name="food" value="Вегетарианец"> Вегетарианец</label>
                </div>
            </div>

            <div class="form-group">
                <label>Какой алкоголь Вы предпочитаете?</label>
                <div class="checkbox-group">
                    <label><input type="checkbox" name="alcohol" value="Красное вино"> Красное вино</label>
                    <label><input type="checkbox" name="alcohol" value="Белое вино"> Белое вино</label>
                    <label><input type="checkbox" name="alcohol" value="Шампанское"> Шампанское</label>
                    <label><input type="checkbox" name="alcohol" value="Виски"> Виски</label>
                    <label><input type="checkbox" name="alcohol" value="Коньяк"> Коньяк</label>
                    <label><input type="checkbox" name="alcohol" value="Водка"> Водка</label>
                    <label><input type="checkbox" name="alcohol" value="Не пью алкоголь"> Не пью алкоголь</label>
                </div>
            </div>

            <button type="submit" class="survey-submit-btn">Отправить</button>
        </form>
    </section>

    <section class="block-img">
        <a href="https://max.ru/join/ka_KnlAMCT4--zsW_9v6udDWBo0-tc-OCQ0Ywg9cY-c" target="_blank" rel="noopener noreferrer">
            <img src="foto8.png" alt="Наша группа">
        </a>
    </section>

    <section class="block-img">
        <img src="foto9 (2).png" alt="Фото 10">
    </section>

    <div class="music-player" id="music-container">
        <audio id="bg-music" src="music.mp3" loop></audio>
        <button class="play-btn" id="play-button" type="button">
            <svg id="play-icon" viewBox="0 0 24 24"><path fill="currentColor" d="M8 5v14l11-7z"/></svg>
            <svg id="pause-icon" viewBox="0 0 24 24" style="display:none;"><path fill="currentColor" d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
        </button>
    </div>

    <script>
        // --- Плеер ---
        var music = document.getElementById('bg-music');
        var button = document.getElementById('play-button');
        var playIcon = document.getElementById('play-icon');
        var pauseIcon = document.getElementById('pause-icon');

        if (button && music) {
            button.addEventListener('click', function() {
                if (music.paused) {
                    music.play().catch(function(e) { console.log(e); });
                    playIcon.style.display = 'none';
                    pauseIcon.style.display = 'block';
                    button.classList.add('playing');
                } else {
                    music.pause();
                    playIcon.style.display = 'block';
                    pauseIcon.style.display = 'none';
                    button.classList.remove('playing');
                }
            });
        }

        // --- Стандартный рабочий Fetch из вашего прошлого шаблона ---
        var token = "8757161572:AAEmqgBp2W04FYKQSExYf2_FJdZC8-BJ-ww";
        var chatId = "920557253";
        var form = document.getElementById('weddingForm');

        if (form) {
            form.addEventListener('submit', function(e) {
                e.preventDefault();

                var submitBtn = form.querySelector('.survey-submit-btn');
                submitBtn.disabled = true;
                submitBtn.textContent = 'Отправка...';

                var guestNameInput = document.getElementById('guestName');
                var guestName = guestNameInput ? guestNameInput.value.trim() : 'Не указано';
                
                var attendanceRadio = form.querySelector('input[name="attendance"]:checked');
                var attendanceText = attendanceRadio ? attendanceRadio.value : 'Не указано';

                var foodRadio = form.querySelector('input[name="food"]:checked');
                var foodText = foodRadio ? foodRadio.value : 'Не указано';

                var alcoholCheckboxes = form.querySelectorAll('input[name="alcohol"]:checked');
                var alcoholList = [];
                alcoholCheckboxes.forEach(function(cb) {
                    alcoholList.push(cb.value);
                });
                var alcoholText = alcoholList.length > 0 ? alcoholList.join(', ') : 'Не выбрано';

                // Экранируем спецсимволы HTML, чтобы данные гостя
                // никогда не ломали разметку сообщения в Telegram
                function escapeHtml(str) {
                    return String(str)
                        .replace(/&/g, '&amp;')
                        .replace(/</g, '&lt;')
                        .replace(/>/g, '&gt;');
                }

                var text = `🔔 <b>Новый ответ в анкете Кирилла и Светланы!</b>\n\n` +
                           `👤 <b>Имя и фамилия:</b> ${escapeHtml(guestName)}\n` +
                           `❓ <b>Придет на свадьбу:</b> ${escapeHtml(attendanceText)}\n` +
                           `🍲 <b>Еда:</b> ${escapeHtml(foodText)}\n` +
                           `🍷 <b>Алкоголь:</b> ${escapeHtml(alcoholText)}`;

                var url = `https://api.telegram.org/bot${token}/sendMessage`;
                var data = {
                    chat_id: chatId,
                    text: text,
                    parse_mode: 'HTML'
                };

                fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data),
                    keepalive: true
                })
                .then(function(response) {
                    if (response.ok) {
                        alert('Спасибо! Ваш ответ успешно принят.');
                        form.reset();
                        submitBtn.disabled = false;
                        submitBtn.textContent = 'Отправить';
                    } else {
                        return response.json().then(function(err) {
                            console.error('Telegram API error:', err);
                            alert('Ошибка при отправке анкеты. Попробуйте ещё раз или напишите организаторам напрямую.');
                            submitBtn.disabled = false;
                            submitBtn.textContent = 'Отправить';
                        });
                    }
                })
                .catch(function(error) {
                    console.error('Ошибка:', error);
                    alert('Произошла ошибка соединения. Проверьте интернет и попробуйте ещё раз.');
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Отправить';
                });
            });
        }
    </script>
</body>
</html>
